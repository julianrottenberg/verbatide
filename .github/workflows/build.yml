name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes; leaving the token in .git/config only gives a
          # compromised step a credential it never needed.
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        # GitHub-hosted runners ship the SDK at /usr/local/lib/android/sdk;
        # anywhere else (Forgejo, plain node images) download the
        # commandline-tools ourselves first. Works on both.
        run: |
          set -eu
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "No preinstalled SDK at $SDK — fetching commandline-tools"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          fi
          CMDLINE="$SDK/cmdline-tools"
          SDKMANAGER="$(find "$CMDLINE" -name sdkmanager -print -quit)"
          # `yes` SIGPIPEs when sdkmanager exits; forgejo-runner/act runs bash with
          # -o pipefail (GitHub does not), so a bare `yes |` fails the step with 141.
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Rename APK to verbatide
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            cp "$APK" "app/build/outputs/apk/debug/verbatide-v${VER}.apk"
            ls -lh app/build/outputs/apk/debug/
          fi

      - name: Upload APK
        # The v4 artifact API is GitHub-only; Forgejo has not implemented it
        # (it still supports v3, which GitHub has sunset). CI artifacts are a
        # GitHub nicety — on Forgejo the release job ships the APK instead.
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: verbatide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload APK (legacy app-debug.apk fallback)
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: verbatide-debug-apk-legacy
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the Forgejo release step below derives release
          # notes from the commit log between the previous tag and this one.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        # GitHub-hosted runners ship the SDK at /usr/local/lib/android/sdk;
        # anywhere else (Forgejo, plain node images) download the
        # commandline-tools ourselves first. Works on both.
        run: |
          set -eu
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "No preinstalled SDK at $SDK — fetching commandline-tools"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          fi
          CMDLINE="$SDK/cmdline-tools"
          SDKMANAGER="$(find "$CMDLINE" -name sdkmanager -print -quit)"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        # Release build type: not debuggable, signed with the production key.
        # The debug build (job above) is the dev artifact; this one is shipped.
        # These env vars are what register the `ci` signing config in
        # app/build.gradle.kts — without them Gradle builds an *unsigned* APK
        # that Android refuses to install, so a missing secret has to fail here
        # instead of attaching nothing to the release.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish an unsigned release APK"
            exit 1
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK to verbatide
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::$APK was not produced"
            exit 1
          fi
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp "$APK" "app/build/outputs/apk/release/verbatide-v${VER}.apk"
          ls -lh app/build/outputs/apk/release/

        # Forgejo's action mirror (data.forgejo.org) does not carry this
        # third-party action, so on Forgejo the release is published with
        # plain API calls in the step below.
      - name: Create GitHub Release
        if: github.server_url == 'https://github.com'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/verbatide-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Create Forgejo Release
        if: github.server_url != 'https://github.com'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          API="$GITHUB_SERVER_URL/api/v1"
          REPO="$GITHUB_REPOSITORY"
          TAG="$GITHUB_REF_NAME"
          APK="$(ls app/build/outputs/apk/release/verbatide-*.apk)"
          [ -f "$APK" ] || { echo "::error::no APK found"; exit 1; }

          # Release notes: commits between the previous tag and this one.
          PREV="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            LOG="$(git log --oneline --no-decorate "$PREV..HEAD")"
          else
            LOG="$(git log --oneline --no-decorate -20)"
          fi
          BODY="$(printf '%s' "$LOG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"

          # Idempotent: reuse the release if a re-run already created it.
          ID="$(
            curl -fsS -H "Authorization: token $TOKEN" "$API/repos/$REPO/releases/tags/$TAG" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' 2>/dev/null || true
          )"
          if [ -z "${ID:-}" ]; then
            ID="$(
              curl -fsS -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":$BODY,\"draft\":false,\"prerelease\":false}" \
                "$API/repos/$REPO/releases" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'
            )"
            echo "Created release $TAG (id $ID)"
          else
            echo "Release $TAG already exists (id $ID) — updating notes"
            curl -fsS -X PATCH -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d "{\"body\":$BODY}" "$API/repos/$REPO/releases/$ID" > /dev/null
          fi

          curl -fsS -X POST -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "$API/repos/$REPO/releases/$ID/assets?name=$(basename "$APK")" > /dev/null
          echo "Uploaded $(basename "$APK") to release $TAG"
