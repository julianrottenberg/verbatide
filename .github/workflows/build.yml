name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Rename APK to verbatide
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            cp "$APK" "app/build/outputs/apk/debug/verbatide-v${VER}.apk"
            ls -lh app/build/outputs/apk/debug/
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verbatide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload APK (legacy app-debug.apk fallback)
        uses: actions/upload-artifact@v4
        with:
          name: verbatide-debug-apk-legacy
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK to verbatide
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            cp "$APK" "app/build/outputs/apk/debug/verbatide-v${VER}.apk"
            ls -lh app/build/outputs/apk/debug/
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/verbatide-*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
